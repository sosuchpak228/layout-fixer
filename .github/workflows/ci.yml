name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add --toolchain 1.98.0 clippy rustfmt
      - name: Format
        run: cargo +1.98.0 fmt --all -- --check
      - name: Test
        run: cargo +1.98.0 test --locked
      - name: Lint
        run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo +1.98.0 build --release --locked
      - name: Portable ZIP and SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/layout-fixer.exe,LICENSE,README.md -DestinationPath layout-fixer-windows-x64.zip
          (Get-FileHash layout-fixer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  layout-fixer-windows-x64.zip' | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: layout-fixer-windows-x64
          path: |
            layout-fixer-windows-x64.zip
            SHA256SUMS.txt
