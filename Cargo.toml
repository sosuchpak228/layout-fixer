[package]
name = "layout-fixer"
version = "0.1.0-preview.3"
edition = "2024"
rust-version = "1.98"
description = "Clipboard-free selected text EN/RU keyboard layout fixer for Windows"
license = "MIT"
publish = false

[dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
